[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-librarian"
version = "0.1.0"
description = "Agent-first local knowledge base CLI"
readme = "docs/superpowers/specs/2026-05-04-kb-librarian-agent-first-design.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
kb = "kb_librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
