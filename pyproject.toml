[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-librarian"
version = "0.1.0"
description = "Agent-first local knowledge base CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
kb = "kb_librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--cov=kb_librarian",
]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "build/pytest_cache"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["kb_librarian"]
data_file = "build/coverage/.coverage"

[tool.coverage.report]
skip_covered = true
show_missing = true
